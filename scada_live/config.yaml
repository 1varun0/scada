# ─── Tank ────────────────────────────────────────────────────
tank:
  cross_section_area_m2: 2.0        # from TankParams
  max_height_m: 2.5
  initial_level_m: 1.0              # H_0
  critical_low_m: 0.3
  critical_high_m: 2.3
  overflow_m: 2.5

# ─── Pump ────────────────────────────────────────────────────
pump:
  q_max_m3s: 0.005                  # 5 L/s
  response_delay_s: 2.0

# ─── Valve ───────────────────────────────────────────────────
valve:
  flow_coefficient_m3s: 0.004       # Cv
  response_time_s: 1.5
  safe_position_pct: 0.0

# ─── Controller ──────────────────────────────────────────────
controller:
  setpoint_m: 1.0
  deadband_m: 0.2
  pump_on_threshold_m: 0.8          # setpoint - deadband
  pump_off_threshold_m: 1.2         # setpoint + deadband
  default_valve_pct: 50.0

# ─── Simulation ──────────────────────────────────────────────
simulation:
  dt_s: 1.0
  time_scale: 1.0                   # NEW: 1x real-time, 5x for fast demos
  sensor_noise_level_m: 0.005
  sensor_noise_flow_m3s: 0.0001
  clamp_flow_noise: false
  random_seed: 42000

# ─── IDS Thresholds ──────────────────────────────────────────
ids:
  tau_p: 0.035                      # from ControllerParams
  tau_l: 0.0085
  tau_a_ms: 1500.0
  tau_a_max_ms: 5000.0              # from AvailabilityEngine default
  tau_fusion: 0.95
  policy_version: "v1"              # "v1" default for equivalence tests, "v2" for live
  lstm_window: 10                   # from DataPreprocessor.window_size
  consecutive_flag_count: 3         # N: flags before ATTACK_DETECTED
  clear_count: 5                    # M: clean ticks before NORMAL
  epsilon_m: 0.05                   # PolicyEngine boundary epsilon

# ─── LSTM Model ──────────────────────────────────────────────
lstm:
  weights_path: "checkpoints/lstm_ae_v1.pt"
  scaler_path: "checkpoints/scaler_v1.pkl"
  input_dim: 5
  hidden_dim: 32
  num_layers: 1
  feature_cols:
    - tank_level_observed
    - q_in
    - q_out
    - pump_state
    - valve_state

# ─── Prevention ──────────────────────────────────────────────
prevention:
  default_mode: "monitor"           # "monitor" or "prevention"
  act_on: ["physics"]               # engines triggering mitigation in Phase 6a
  takeover_engines: ["physics"]     # engines triggering digital twin takeover
  trigger_state: "CRITICAL"         # Alert state required to trigger mitigation
  fdi_takeover: true                # feed twin level to controller
  handback_tolerance_m: 0.05        # level tolerance to return control to sensor
  auto_handback: false              # automatically hand back control when safe (true in headless test harness)
  safe_pump_state: 0                # OFF on DoS
  safe_valve_pct: 0.0               # closed on DoS
  dos_rate_limit_per_s: 10
  quarantine_duration_s: 30
  stale_packet_tolerance_s: 5.0


# ─── Network ─────────────────────────────────────────────────
network:
  plant_host: "127.0.0.1"
  plant_port: 5100
  scada_host: "127.0.0.1"
  scada_port: 5000
  attacker_host: "127.0.0.1"
  attacker_port: 5001

gateway:
  sense_timeout_s: 0.5
  sse_queue_size: 200
  sse_keepalive_s: 15
  history_size: 300
  watchdog_enabled: false
  watchdog_factor: 1.5
alert:
  n_flags: 3
  window_w: 5
  m_clear: 5
recalibration:
  n_samples: 10
  max_std_m: 0.03
persistence:
  db_path: data/live_run.db

